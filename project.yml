name: MetaCity
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

options:
  bundleIdPrefix: com.metacity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: "YES"

targets:
  MetaCity:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MetaCity
    info:
      path: MetaCity/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "MetaCity uses your location to center the map, find nearby landmarks, and power live presence."
        NSLocationAlwaysAndWhenInUseUsageDescription: "MetaCity can keep showing your position to nearby friends while the app is in the background."
        NSCameraUsageDescription: "MetaCity needs camera access for video calls."
        NSMicrophoneUsageDescription: "MetaCity needs microphone access so other participants can hear you on a call."
        NSSpeechRecognitionUsageDescription: "MetaCity uses voice recognition so you can search for cities and districts by speaking."
        NSFaceIDUsageDescription: "MetaCity can use Face ID to lock your profile when you enable it in Profile > Security."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.277769234407-ijrlufpcg92mkij4a8huc1td921simpu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metacity.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CX3S4W8M46
    dependencies:
      - sdk: SceneKit.framework
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn

  MetaCityTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MetaCityTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.metacity.app.tests
    dependencies:
      - target: MetaCity

schemes:
  MetaCity:
    build:
      targets:
        MetaCity: all
        MetaCityTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MetaCityTests
    archive:
      config: Release
